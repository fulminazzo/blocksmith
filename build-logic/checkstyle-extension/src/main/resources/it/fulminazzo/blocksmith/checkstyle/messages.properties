# GENERAL
## Declaration
it.fulminazzo.blocksmith.checkstyle.declaration=Invalid declaration order; should be: fields, constructors, methods and types
## Visibility
it.fulminazzo.blocksmith.checkstyle.public=Public elements must be declared before any other visibility element
it.fulminazzo.blocksmith.checkstyle.protected=Protected elements must be declared after public and before package and private elements
it.fulminazzo.blocksmith.checkstyle.package=Package elements must be declared after protected and before private elements
it.fulminazzo.blocksmith.checkstyle.private=Private elements must be declared after any other visibility element
## Static
it.fulminazzo.blocksmith.checkstyle.static=Invalid static element ordering: static elements must be declared before non-static ones
it.fulminazzo.blocksmith.checkstyle.non-static=Invalid non-static element ordering: non-static elements must be declared after static ones
# FIELD
## Mutability
it.fulminazzo.blocksmith.checkstyle.field.final=Final fields must be declared before mutable fields
it.fulminazzo.blocksmith.checkstyle.field.non-final=Mutable fields must be declared after final fields
# TYPE
it.fulminazzo.blocksmith.checkstyle.type.interface=Interfaces must be declared before any other type
it.fulminazzo.blocksmith.checkstyle.type.enum=Enums must be declared after interfaces and before records and classes
it.fulminazzo.blocksmith.checkstyle.type.record=Records must be declared after enums and before classes
it.fulminazzo.blocksmith.checkstyle.type.class=Classes must be declared after any other type
# EXECUTABLE
## Overload
it.fulminazzo.blocksmith.checkstyle.executable.overload=Overloaded methods and constructors must be declared one after the other, with descending parameters count, and primitives should go before wrappers
it.fulminazzo.blocksmith.checkstyle.executable.overload.grouped=Overloaded methods must be grouped (no other method can be declared among them)
## Parenthesis
it.fulminazzo.blocksmith.checkstyle.executable.parenthesis.noParameters=Methods and constructors with no parameters must have their parentheses on the same line as the declaration
it.fulminazzo.blocksmith.checkstyle.executable.parenthesis.parameters=Methods and constructors with parameters spanning multiple lines must place every parameter on its own line, with the opening and closing parentheses left empty (no parameter adjacent to either parenthesis)
# METHOD
## Trait
it.fulminazzo.blocksmith.checkstyle.method.abstract=Abstract methods must be declared before any other method
it.fulminazzo.blocksmith.checkstyle.method.concrete=Concrete methods must be declared after abstract and before overridden methods
it.fulminazzo.blocksmith.checkstyle.method.override=Overridden methods must be declared after concrete and before static methods
it.fulminazzo.blocksmith.checkstyle.method.static=Static methods must be declared after any other method
## Name
it.fulminazzo.blocksmith.checkstyle.method.name.any=Methods with general names must be before paired methods (like getters and setters), "equals", "hashCode" and "toString"
it.fulminazzo.blocksmith.checkstyle.method.name.pairedMethods=Paired methods must be after general methods and before "equals", "hashCode" and "toString". Also, paired methods ordering must be: all adders/removers, registerers/unregisterers, adders/removers, finally getters/setters
it.fulminazzo.blocksmith.checkstyle.method.name.equals="equals" must be after general methods, paired methods (like getters and setters) and before "hashCode" and "toString"
it.fulminazzo.blocksmith.checkstyle.method.name.hashCode="hashCode" must be after general methods, paired methods (like getters and setters) and "equals" and before "toString"
it.fulminazzo.blocksmith.checkstyle.method.name.toString="toString" must be after paired methods (like getters and setters), "equals", "hashCode" and "toString"
## Paired methods
it.fulminazzo.blocksmith.checkstyle.method.pair.first=Methods prefixed with "{0}" must come before methods prefixed with "{1}" and with the same leading name
it.fulminazzo.blocksmith.checkstyle.method.pair.second=Methods prefixed with "{0}" must come after methods prefixed with "{1}" and with the same leading name
# ANNOTATION
it.fulminazzo.blocksmith.checkstyle.annotation=Invalid annotations order, they should be declared as: {0}