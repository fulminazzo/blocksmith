it.fulminazzo.blocksmith.checkstyle.non-final=Mutable fields must be declared after final fields
# Static
it.fulminazzo.blocksmith.checkstyle.static=Invalid static element ordering: fields must be declared before instance fields, methods after
it.fulminazzo.blocksmith.checkstyle.non-static=Invalid non-static element ordering: fields must be declared after instance fields, methods before
# Visibility
it.fulminazzo.blocksmith.checkstyle.public=Public elements must be declared before any other visibility element
it.fulminazzo.blocksmith.checkstyle.protected=Protected elements must be declared after public and before package and private elements
it.fulminazzo.blocksmith.checkstyle.package=Package elements must be declared after protected and before private elements
it.fulminazzo.blocksmith.checkstyle.private=Private elements must be declared after any other visibility element
# Type
it.fulminazzo.blocksmith.checkstyle.interface=Interfaces must be declared before any other type
it.fulminazzo.blocksmith.checkstyle.enum=Enums must be declared after interfaces and before records and classes
it.fulminazzo.blocksmith.checkstyle.record=Records must be declared after enums and before classes
it.fulminazzo.blocksmith.checkstyle.class=Classes must be declared after any other type
# Overload
it.fulminazzo.blocksmith.checkstyle.overload=Overloaded methods or constructors must be declared one after the other, with descending parameters count, and primitives should go before wrappers